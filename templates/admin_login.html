<!doctype html>
<html>
<head>
  <title>Admin Login</title>
  <style>
    body { font-family: Arial; background:#f5f5f5; display:flex; justify-content:center; align-items:center; height:100vh; }
    .box { background:white; padding:20px; border-radius:10px; width:350px; }
    input { width:100%; padding:10px; margin:10px 0; border:1px solid #ccc; border-radius:6px; }
    button { width:100%; padding:10px; background:#111; color:white; border:none; border-radius:6px; cursor:pointer; }
  </style>
</head>
<body>

<div class="box">
  <h2>Admin Login</h2>
  <input type="text" id="username" placeholder="Admin Username">
  <input type="password" id="password" placeholder="Password">
  <button onclick="adminLogin()">Login</button>
  <p id="msg"></p>
</div>

<script>
async function adminLogin(){
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  const res = await fetch("/api/admin/login", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({username, password})
  });

  const data = await res.json();

  if(data.success){
    window.location.href = "/admin";
  } else {
    document.getElementById("msg").innerText = data.message;
  }
}
</script>

</body>
</html>
