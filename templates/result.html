<!doctype html>
<html>
<head>
  <title>Botalyst - Result</title>
  <style>
    body { font-family: Arial; padding:20px; background:#f5f5f5; }
    .card { background:white; padding:15px; border-radius:10px; margin-bottom:15px; }
    img { max-width:100%; border-radius:10px; }
    a { display:inline-block; padding:10px 15px; background:#111; color:white; text-decoration:none; border-radius:8px; }
  </style>
</head>
<body>

  <h2>📊 Botalyst Result</h2>

  <div class="card">
    <h3>Summary</h3>
    <pre>{{ summary }}</pre>
  </div>

  <div class="card">
    <h3>Charts</h3>
    {% for chart in charts %}
      <img src="{{ url_for('static', filename='charts/' + chart) }}" alt="chart">
      <br><br>
    {% endfor %}
  </div>

  <div class="card">
    <h3>Download Report</h3>
    <a href="/api/download-report/{{ report_name }}">Download Report</a>
  </div>

</body>
</html>
