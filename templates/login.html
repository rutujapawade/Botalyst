<!doctype html>
<html>
  <head>
    <title>Botalyst – Login</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        font-family: Arial;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #1f1c2c, #928dab);
      }

      .card {
        background: white;
        padding: 30px;
        width: 360px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      h2 {
        text-align: center;
        margin-bottom: 20px;
      }

      input {
        width: 100%;
        padding: 12px;
        margin-bottom: 12px;
        border-radius: 6px;
        border: 1px solid #ccc;
      }

      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #111;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #333;
      }

      .msg {
        margin-top: 10px;
        text-align: center;
        color: red;
      }

      .link {
        margin-top: 15px;
        text-align: center;
      }

      .link a {
        text-decoration: none;
        color: #007bff;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h2>Login to Botalyst</h2>

      <input
        type="text"
        id="loginId"
        placeholder="Email or Mobile"
      />

      <input
        type="password"
        id="password"
        placeholder="Password"
      />

      <button onclick="login()">Login</button>

      <div class="msg" id="msg"></div>

      <div class="link">
        New user?
        <a href="/signup">Create an account</a>
      </div>
    </div>

    <script>
      async function login() {
        const loginId = document.getElementById("loginId").value.trim();
        const password = document.getElementById("password").value.trim();
        const msg = document.getElementById("msg");

        msg.innerText = "";

        if (!loginId || !password) {
          msg.innerText = "Please fill all fields";
          return;
        }

        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            login_id: loginId,
            password: password
          })
        });

        const data = await res.json();

        if (data.success) {
          window.location.href = "/user";
        } else {
          msg.innerText = data.message;
        }
      }
    </script>
  </body>
</html>
